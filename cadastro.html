<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Biblioteca</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .bg-animated {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      z-index: -2;
      animation: zoomBg 18s infinite alternate ease-in-out;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    @keyframes zoomBg {
      0% { transform: scale(1); }
      100% { transform: scale(1.12); }
    }

    .card-cadastro {
      background-color: rgba(217, 217, 217, 0.92);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 420px;
      padding: 35px 30px 30px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card-cadastro h1 {
      text-align: center;
      font-size: 2.6rem;
      font-weight: 900;
      color: #000;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 1rem;
      font-weight: bold;
      color: #1a1a1a;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #333;
      border-radius: 16px;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #8061ff;
      box-shadow: 0 0 0 2px #8061ff;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 25px;
    }

    .opcao-tipo {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      color: #4a38a8;
      font-weight: bold;
      font-size: 0.8rem;
      gap: 4px;
    }

    .opcao-tipo svg {
      width: 38px;
      height: 38px;
      stroke: #4a38a8;
      stroke-width: 2;
      fill: none;
    }

    .btn-cadastrar {
      background-color: #7162f8;
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 10px 24px;
      border: 1px solid #333;
      border-radius: 18px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn-cadastrar:hover {
      background-color: #5d4ce0;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="bg-animated"></div>
  <div class="overlay"></div>

  <div class="card-cadastro">
    <h1>Cadastro</h1>

    <form action="processa_cadastro.php" method="POST">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" minlength="8" required>
      </div>

      <div class="form-footer">
        <button type="button" class="opcao-tipo">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
          Usuário
        </button>

        <button type="submit" class="btn-cadastrar">Cadastrar</button>

        <button type="button" class="opcao-tipo">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10z"></path>
            <circle cx="12" cy="14" r="2.5"></circle>
          </svg>
          Administrador
        </button>
      </div>
    </form>
  </div>

</body>
</html>
