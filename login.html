<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Imagem de Fundo de Livros com Zoom Animado */
    .bg-animated {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      z-index: -2;
      animation: zoomBg 18s infinite alternate ease-in-out;
    }

    /* Camada escura para dar destaque ao card de login */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    /* Animação do fundo */
    @keyframes zoomBg {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.12);
      }
    }

    /* Card Principal */
    .card-login {
      background-color: rgba(217, 217, 217, 0.92);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 380px;
      padding: 40px 30px 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card-login h1 {
      text-align: center;
      font-size: 3rem;
      font-weight: 900;
      color: #000;
      margin-bottom: 30px;
    }

    /* Campos de Entrada */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 1.5rem;
      font-weight: 900;
      color: #000;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 1px solid #333;
      border-radius: 16px;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #6a55e0;
      box-shadow: 0 0 0 2px #6a55e0;
    }

    /* Mensagem de Erro */
    .mensagem-erro {
      color: #d93025;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      margin-top: 15px;
      display: none; /* Inicia escondido */
    }

    /* Botões na parte inferior */
    .botoes-container {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    .btn-entrar {
      flex: 1;
      background-color: #6a55e0;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 12px 0;
      border: 1px solid #333;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn-entrar:hover {
      background-color: #5743c7;
      transform: translateY(-2px);
    }

    .btn-cadastre {
      flex: 1.2;
      background-color: #3b3598;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;
      padding: 12px 0;
      border: 1px solid #333;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn-cadastre:hover {
      background-color: #2e2978;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Elementos do Fundo Animado -->
  <div class="bg-animated"></div>
  <div class="overlay"></div>

  <div class="card-login">
    <h1>Login</h1>

    <form id="form-login">
      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>
      </div>

      <!-- Div da mensagem de erro -->
      <div id="mensagem-erro" class="mensagem-erro">Usuário não encontrado</div>

      <div class="botoes-container">
        <button type="button" id="btn-entrar" class="btn-entrar">Entrar</button>
        <a href="cadastro.html" class="btn-cadastre">Cadastre-se</a>
      </div>
    </form>
  </div>

  <script>
    const btnEntrar = document.getElementById('btn-entrar');
    const mensagemErro = document.getElementById('mensagem-erro');
    const cpfInput = document.getElementById('cpf');
    const senhaInput = document.getElementById('senha');

    btnEntrar.addEventListener('click', function() {
    if (cpfInput.value.trim() !== "" && senhaInput.value.trim() !== "") {
        // Redireciona para o painel principal se os campos estiverem preenchidos
        window.location.href = "inicio.html";
      } else {
        mensagemErro.innerText = "Por favor, preencha o CPF e a senha.";
        mensagemErro.style.display = 'block';
      }
    });
  </script>

</body>
</html>
