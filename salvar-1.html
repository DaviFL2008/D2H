<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Equipamento</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Georgia, serif;
        }

        body {
            background-color: #D6E8FA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* CARD PRINCIPAL */
        .form-card {
            background-color: #D9D9D9;
            width: 100%;
            max-width: 420px;
            padding: 28px 24px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000000;
            margin-bottom: 20px;
        }

        /* CAMPOS DO FORMULÁRIO */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4A4A4A;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            height: 42px;
            padding: 0 16px;
            border: 1px solid #777777;
            border-radius: 20px;
            background-color: #FFFFFF;
            font-size: 1rem;
            outline: none;
        }

        .section-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #000000;
            margin: 24px 0 16px 0;
        }

        /* BOTÕES INFERIORES */
        .status-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-purple {
            background-color: #6C5CE7;
            color: #FFFFFF;
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            flex: 1;
        }

        .btn-purple:hover {
            background-color: #5A4AD1;
            transform: scale(1.02);
        }

        /* OVERLAY / MODAL DE CONFIRMAÇÃO */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(200, 200, 200, 0.85);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }

        /* ESCONDER O MODAL INICIALMENTE (DESCOMENTE SE PREFERIR ABRIR VIA AÇÃO) */
        .modal-overlay.hidden {
            display: none;
        }

        .modal-box {
            background-color: #64B5F6;
            border: 2px solid #333333;
            border-radius: 16px;
            padding: 16px 20px;
            text-align: center;
            width: 80%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .modal-box h3 {
            color: #FFFFFF;
            font-size: 1.25rem;
            font-weight: bold;
            line-height: 1.3;
        }

        .modal-actions {
            display: flex;
            gap: 16px;
            width: 80%;
            justify-content: center;
        }

        .modal-btn {
            background-color: #6C5CE7;
            color: #FFFFFF;
            border: 2px solid #333333;
            border-radius: 16px;
            padding: 8px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .modal-btn:hover {
            background-color: #5A4AD1;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="form-card">
        
        <h2 class="title">Novo Equipamento</h2>

        <form id="equipForm">
            <div class="form-group">
                <label>Foto</label>
                <input type="text" class="form-control" placeholder="Adicionar foto:">
            </div>

            <div class="form-group">
                <label>Nome</label>
                <input type="text" class="form-control">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <input type="text" class="form-control">
            </div>

            <h3 class="section-title">Em uso?</h3>

            <div class="status-buttons">
                <button type="button" class="btn-purple" onclick="abrirModal()">Sim, Está em uso</button>
                <button type="button" class="btn-purple" onclick="abrirModal()">Não está em uso</button>
            </div>
        </form>

<div class="modal-overlay hidden" id="confirmModal">
    <div class="modal-box">
        <h3>Tem certeza que<br>deseja salvar?</h3>
    </div>
    <div class="modal-actions">
        <button class="modal-btn" onclick="fecharModal()">Não</button>
        <button class="modal-btn" onclick="salvarEquipamento()">Sim</button>
    </div>
</div>

    <script>
        const modal = document.getElementById('confirmModal');

        function abrirModal() {
            modal.classList.remove('hidden');
        }

        function fecharModal() {
            modal.classList.add('hidden');
        }

        function salvarEquipamento() {
            alert("Equipamento salvo com sucesso!");
            fecharModal();
            document.getElementById('equipForm').reset();
        }
    </script>

</body>
</html>
